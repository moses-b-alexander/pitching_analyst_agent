# Live pitching agent configuration. See docs/decisions.md for rationale.

db_path: data/baseball.sqlite    # observations only
cache_dir: data/cache            # Savant season pulls

# One OpenAI-compatible endpoint. Default is local Ollama.
# model: null runs facts-only (stat lines still work without any model).
llm:
  base_url: http://localhost:11434/v1
  model: qwen3:8b-8k             # qwen3:8b with an 8,192-token window; see ollama/Modelfile
  reasoning_effort: none         # skip hidden thinking: ~1 s per call instead of ~12 s; null to allow it
  api_key_env: null            # e.g. GROQ_API_KEY for a hosted open-weight provider

polling:
  live_interval_s: 15            # feed suggests >= 10 s (metaData.wait)
  exit_reconcile_interval_s: 600
  exit_give_up_after_game_end_s: 7200

output:
  half_inning: capsule_only      # capsule_only | silent
  half_inning_lag: 1             # half-innings to wait before printing a capsule
  starter_exit: print_immediately
